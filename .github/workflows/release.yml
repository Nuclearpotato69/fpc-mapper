name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build 1.21.11
        env:
          FPC_AUTH_TOKEN: ${{ secrets.FPC_AUTH_TOKEN }}
        run: ./gradlew :mc1_21_11:build --no-daemon

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build 26.2
        env:
          FPC_AUTH_TOKEN: ${{ secrets.FPC_AUTH_TOKEN }}
        run: ./gradlew :mc26_2:build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          cp mc1_21_11/build/libs/*.jar dist/
          cp mc26_2/build/libs/*.jar dist/
          ls -la dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.jar \
            --title "${{ github.ref_name }}" \
            --generate-notes
