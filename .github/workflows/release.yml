name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (replaces its jars in place)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build 1.21.11
        env:
          FPC_AUTH_TOKEN: ${{ secrets.FPC_AUTH_TOKEN }}
        run: ./gradlew :mc1_21_11:build --no-daemon

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build 26.2
        env:
          FPC_AUTH_TOKEN: ${{ secrets.FPC_AUTH_TOKEN }}
        run: ./gradlew :mc26_2:build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          cp mc1_21_11/build/libs/*.jar dist/
          cp mc26_2/build/libs/*.jar dist/
          ls -la dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar --clobber
          else
            gh release create "$TAG" dist/*.jar --title "$TAG" --generate-notes
          fi
